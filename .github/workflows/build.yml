name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows
          - os: macos-14
            preset: macos
          - os: ubuntu-24.04
            preset: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja glfw openssl@3
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libglfw3-dev libgl1-mesa-dev libssl-dev libsecret-1-dev pkg-config
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3
      - name: Stage clean package
        run: cmake --install build/${{ matrix.preset }} --config Release --prefix package
      - name: Upload build (not a signed release)
        uses: actions/upload-artifact@v4
        with:
          name: codex-switcher-${{ matrix.preset }}-${{ runner.arch }}
          path: package/
          if-no-files-found: error
